# ─────────────────────────────────────────────────────────────────────────────
#  Nginx API Gateway — E-Bike Platform
#
#  Exposes all 8 microservices under a single public port (80).
#  In production, terminate TLS here and listen on 443.
#
#  Route map:
#    /auth/*          → auth-service:3001
#    /fleet/*         → fleet-service:3002
#    /rides/*         → ride-service:3003
#    /pricing/*       → pricing-service:3005
#    /payments/*      → payment-service:3006
#    /notifications/* → notification-service:3007
#    /live            → websocket-hub:3008   (WS upgrade)
#    /docks/*         → dock-service:3009
#    /health          → 200 OK (gateway liveness)
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
}

http {
  # ── Logging ───────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $request_id - [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;

  # ── Request ID (propagate into upstream via X-Request-ID) ────────────────────
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # ── Upstream definitions ──────────────────────────────────────────────────────
  upstream auth_svc          { server auth-service:3001; keepalive 32; }
  upstream fleet_svc         { server fleet-service:3002; keepalive 32; }
  upstream ride_svc          { server ride-service:3003; keepalive 32; }
  upstream pricing_svc       { server pricing-service:3005; keepalive 16; }
  upstream payment_svc       { server payment-service:3006; keepalive 16; }
  upstream notification_svc  { server notification-service:3007; keepalive 8; }
  upstream ws_hub            { server websocket-hub:3008; keepalive 64; }
  upstream dock_svc          { server dock-service:3009; keepalive 16; }

  # ── Rate limiting zones ───────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=global:10m  rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;

  # ── Common proxy headers ──────────────────────────────────────────────────────
  proxy_http_version      1.1;
  proxy_set_header        Host              $host;
  proxy_set_header        X-Real-IP         $remote_addr;
  proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header        X-Forwarded-Proto $scheme;
  proxy_set_header        X-Request-ID      $req_id;
  proxy_connect_timeout   5s;
  proxy_send_timeout      30s;
  proxy_read_timeout      30s;
  proxy_buffering         off;

  # ── CORS helper ───────────────────────────────────────────────────────────────
  map $request_method $cors_method {
    OPTIONS 1;
    default 0;
  }

  # ── Server ────────────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Gateway liveness
    location = /health {
      access_log off;
      return 200 '{"status":"ok","gateway":"nginx"}';
      add_header Content-Type application/json;
    }

    # ── Auth service ──────────────────────────────────────────────────────────
    location /auth/ {
      limit_req zone=auth burst=20 nodelay;
      proxy_pass http://auth_svc/auth/;
    }

    # ── Fleet service ─────────────────────────────────────────────────────────
    location /fleet/ {
      limit_req zone=global burst=60 nodelay;
      proxy_pass http://fleet_svc/fleet/;
    }

    # ── Ride service ──────────────────────────────────────────────────────────
    location /rides/ {
      limit_req zone=global burst=60 nodelay;
      proxy_pass http://ride_svc/rides/;
    }


    # ── Pricing service ───────────────────────────────────────────────────────
    location /pricing/ {
      limit_req zone=global burst=120 nodelay;   # high — surge polling
      proxy_pass http://pricing_svc/pricing/;
    }

    # ── Payment service ───────────────────────────────────────────────────────
    location /payments/ {
      limit_req zone=auth burst=10 nodelay;       # strict — financial ops
      proxy_pass http://payment_svc/payments/;
    }

    # ── Notification service ──────────────────────────────────────────────────
    location /notifications/ {
      limit_req zone=global burst=30 nodelay;
      proxy_pass http://notification_svc/notifications/;
    }

    # ── Dock service ──────────────────────────────────────────────────────────
    location /docks/ {
      limit_req zone=global burst=60 nodelay;
      proxy_pass http://dock_svc/docks/;
    }

    # ── WebSocket hub (upgrade required) ─────────────────────────────────────
    location /live {
      proxy_pass http://ws_hub;
      proxy_http_version  1.1;
      proxy_set_header    Upgrade    $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_read_timeout  3600s;    # hold WS open up to 1 h
      proxy_send_timeout  3600s;
    }

    # ── Socket.io routing ───────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass http://ws_hub/socket.io/;
      proxy_http_version  1.1;
      proxy_set_header    Upgrade    $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }

    # ── Health check pass-through for all services ────────────────────────────
    location ~ ^/healthz {
      proxy_pass http://auth_svc;   # any service — they all expose /healthz
    }
  }
}
