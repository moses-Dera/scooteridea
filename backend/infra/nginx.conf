# ─────────────────────────────────────────────────────────────────────────────
#  Nginx API Gateway — E-Bike Platform
#
#  Exposes all 8 microservices under a single public port (80).
#  In production, terminate TLS here and listen on 443.
#
#  Route map:
#    /auth/*          → auth-service:3001
#    /fleet/*         → fleet-service:3002
#    /rides/*         → ride-service:3003
#    /pricing/*       → pricing-service:3005
#    /payments/*      → payment-service:3006
#    /notifications/* → notification-service:3007
#    /live            → websocket-hub:3008   (WS upgrade)
#    /docks/*         → dock-service:3009
#    /health          → 200 OK (gateway liveness)
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
}

http {
  # ── Logging ───────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $request_id - [$time_local] '
                  '"$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" '
                  'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

  access_log /var/log/nginx/access.log main;

  # ── Request ID (propagate into upstream via X-Request-ID) ────────────────────
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  # ── Docker DNS resolver (re-resolve on every request) ─────────────────────────
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # ── Rate limiting zones ───────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=global:10m  rate=1000r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m    rate=100r/s;

  # ── Common proxy headers ──────────────────────────────────────────────────────
  proxy_http_version      1.1;
  proxy_set_header        Host              $host;
  proxy_set_header        X-Real-IP         $remote_addr;
  proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header        X-Forwarded-Proto $scheme;
  proxy_set_header        X-Request-ID      $req_id;
  proxy_connect_timeout   5s;
  proxy_send_timeout      30s;
  proxy_read_timeout      30s;
  proxy_buffering         off;

  # ── CORS helper ───────────────────────────────────────────────────────────────
  map $request_method $cors_method {
    OPTIONS 1;
    default 0;
  }

  # ── Server ────────────────────────────────────────────────────────────────────
  # ── HTTP Server ───────────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name scooterfy.duckdns.org localhost _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS Server ──────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name scooterfy.duckdns.org localhost _;

    ssl_certificate /etc/letsencrypt/live/scooterfy.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scooterfy.duckdns.org/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gateway liveness
    location = /health {
      access_log off;
      return 200 '{"status":"ok","gateway":"nginx","ssl":true}';
      add_header Content-Type application/json;
    }

    # ── Auth service ──────────────────────────────────────────────────────────
    location /auth/ {
      limit_req zone=auth burst=20 nodelay;
      set $upstream_auth http://auth-service:3001$request_uri;
      proxy_pass $upstream_auth;
    }

    # ── Fleet service ─────────────────────────────────────────────────────────
    location /fleet/ {
      limit_req zone=global burst=60 nodelay;
      set $upstream_fleet http://fleet-service:3002$request_uri;
      proxy_pass $upstream_fleet;
    }

    # ── Ride service ──────────────────────────────────────────────────────────
    location /rides/ {
      limit_req zone=global burst=60 nodelay;
      set $upstream_ride http://ride-service:3003$request_uri;
      proxy_pass $upstream_ride;
    }

    # ── Pricing service ───────────────────────────────────────────────────────
    location /pricing/ {
      limit_req zone=global burst=120 nodelay;
      set $upstream_pricing http://pricing-service:3005$request_uri;
      proxy_pass $upstream_pricing;
    }

    # ── Payment service ───────────────────────────────────────────────────────
    location /payments/ {
      limit_req zone=auth burst=10 nodelay;
      set $upstream_payment http://payment-service:3006$request_uri;
      proxy_pass $upstream_payment;
    }

    # ── Notification service ──────────────────────────────────────────────────
    location /notifications/ {
      limit_req zone=global burst=30 nodelay;
      set $upstream_notification http://notification-service:3007$request_uri;
      proxy_pass $upstream_notification;
    }

    # ── Dock service ──────────────────────────────────────────────────────────
    location /docks/ {
      limit_req zone=global burst=60 nodelay;
      set $upstream_dock http://dock-service:3009$request_uri;
      proxy_pass $upstream_dock;
    }

    # ── WebSocket hub (upgrade required) ─────────────────────────────────────
    location /live {
      set $upstream_ws http://websocket-hub:3008$request_uri;
      proxy_pass $upstream_ws;
      proxy_http_version  1.1;
      proxy_set_header    Upgrade    $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }

    # ── Socket.io routing ───────────────────────────────────────────────────
    location /socket.io/ {
      set $upstream_ws_io http://websocket-hub:3008$request_uri;
      proxy_pass $upstream_ws_io;
      proxy_http_version  1.1;
      proxy_set_header    Upgrade    $http_upgrade;
      proxy_set_header    Connection "upgrade";
      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
    }

    # ── Health check (self-contained, no upstream dependency) ───────────────
    location = /healthz {
      access_log off;
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }
  }

}
