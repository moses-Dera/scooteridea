

services:
  # ── Infrastructure ────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB:       ebike
      POSTGRES_USER:     ebike
      POSTGRES_PASSWORD: secret
    ports:
      - '5440:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ebike']
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 5



  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '1883:1883'
      - '8083:8083'
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      retries: 5

  # ── API Gateway ──────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - '80:80'       # single public ingress point
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Backend Services ──────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ../../
      dockerfile: backend/services/auth/Dockerfile
    expose:
      - '3001'
    environment:
      PORT:                3001
      DATABASE_URL:        postgresql://ebike:secret@postgres:5432/ebike
      REDIS_URL:           redis://redis:6379
      JWT_ACCESS_SECRET:   ${JWT_ACCESS_SECRET}
      JWT_REFRESH_EXPIRY:  30d
      JWT_ACCESS_EXPIRY:   15m
      GOOGLE_CLIENT_ID:    ${GOOGLE_CLIENT_ID}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  fleet-service:
    build:
      context: ../../
      dockerfile: backend/services/fleet/Dockerfile
    expose:
      - '3002'
    environment:
      PORT:             3002
      DATABASE_URL:     postgresql://ebike:secret@postgres:5432/ebike
      REDIS_URL:        redis://redis:6379
      MQTT_BROKER_URL:  mqtt://mosquitto:1883
      MQTT_USERNAME:    ${MQTT_USERNAME}
      MQTT_PASSWORD:    ${MQTT_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  ride-service:
    build:
      context: ../../
      dockerfile: backend/services/ride/Dockerfile
    expose:
      - '3003'
    environment:
      PORT:             3003
      DATABASE_URL:     postgresql://ebike:secret@postgres:5432/ebike
      REDIS_URL:        redis://redis:6379
      MQTT_BROKER_URL:  mqtt://mosquitto:1883
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }



  pricing-service:
    build:
      context: ../../
      dockerfile: backend/services/pricing/Dockerfile
    expose:
      - '3005'
    environment:
      PORT:       3005
      REDIS_URL:  redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      redis: { condition: service_healthy }

  payment-service:
    build:
      context: ../../
      dockerfile: backend/services/payment/Dockerfile
    expose:
      - '3006'
    environment:
      PORT:                  3006
      DATABASE_URL:          postgresql://ebike:secret@postgres:5432/ebike
      REDIS_URL:             redis://redis:6379
      STRIPE_SECRET_KEY:     ${STRIPE_SECRET_KEY}
      PAYSTACK_SECRET_KEY:   ${PAYSTACK_SECRET_KEY}
      JWT_ACCESS_SECRET:     ${JWT_ACCESS_SECRET}
    depends_on:
      postgres: { condition: service_healthy }

  notification-service:
    build:
      context: ../../
      dockerfile: backend/services/notification/Dockerfile
    expose:
      - '3007'
    environment:
      PORT:               3007
      REDIS_URL:          redis://redis:6379
      EXPO_ACCESS_TOKEN:  ${EXPO_ACCESS_TOKEN}
      JWT_ACCESS_SECRET:  ${JWT_ACCESS_SECRET}
    depends_on:
      redis: { condition: service_healthy }

  websocket-hub:
    build:
      context: ../../
      dockerfile: backend/services/websocket-hub/Dockerfile
    expose:
      - '3008'
    environment:
      PORT:               3008
      REDIS_URL:          redis://redis:6379
      JWT_ACCESS_SECRET:  ${JWT_ACCESS_SECRET}
    depends_on:
      redis: { condition: service_healthy }

  dock-service:
    build:
      context: ../../
      dockerfile: backend/services/dock/Dockerfile
    expose:
      - '3009'
    environment:
      PORT:             3009
      DATABASE_URL:     postgresql://ebike:secret@postgres:5432/ebike
      REDIS_URL:        redis://redis:6379
      MQTT_BROKER_URL:  mqtt://mosquitto:1883
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  hardware-simulator:
    build:
      context: ../../simulator
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER: mqtt://mosquitto:1883
      MQTT_USERNAME:   ${MQTT_USERNAME}
      MQTT_PASSWORD:   ${MQTT_PASSWORD}
      API_URL:         http://nginx:80
    depends_on:
      mosquitto: { condition: service_healthy }
      nginx:     { condition: service_started }

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
