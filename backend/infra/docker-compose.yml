services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ebike
      POSTGRES_USER: ebike
      POSTGRES_PASSWORD: secret
    ports:
    - 5440:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ebike
      interval: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
    - 6380:6379
    volumes:
    - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 5s
      retries: 5
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
    - 1883:1883
    - 8083:8083
    volumes:
    - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    - ./mosquitto.passwd:/mosquitto/config/passwd
    - mosquitto_data:/mosquitto/data
    - mosquitto_log:/mosquitto/log
    healthcheck:
      test:
      - CMD-SHELL
      - mosquitto_sub -t '$$SYS/#' -C 1 -W 3 || exit 1
      interval: 10s
      retries: 5
  nginx:
    image: nginx:1.27-alpine
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
    extra_hosts:
    - host.docker.internal:host-gateway
    restart: unless-stopped
  auth-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-moses-dera}/scooteridea-auth-service:latest
    expose:
    - '3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://ebike:secret@postgres:5432/ebike
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRY: 30d
      JWT_ACCESS_EXPIRY: 15m
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on:
    - postgres
    - redis
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3001/health/ready
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
  fleet-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-moses-dera}/scooteridea-fleet-service:latest
    expose:
    - '3002'
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://ebike:secret@postgres:5432/ebike
      REDIS_URL: redis://redis:6379
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
    - postgres
    - redis
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3002/health/ready
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
  ride-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-moses-dera}/scooteridea-ride-service:latest
    expose:
    - '3003'
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://ebike:secret@postgres:5432/ebike
      REDIS_URL: redis://redis:6379
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
    - postgres
    - redis
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3003/health/ready
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
  pricing-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-moses-dera}/scooteridea-pricing-service:latest
    expose:
    - '3005'
    environment:
      PORT: 3005
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
    - redis
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3005/health/ready
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
  payment-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-moses-dera}/scooteridea-payment-service:latest
    expose:
    - '3006'
    environment:
      PORT: 3006
      DATABASE_URL: postgresql://ebike:secret@postgres:5432/ebike
      REDIS_URL: redis://redis:6379
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
    - postgres
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3006/health/ready
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
  notification-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-moses-dera}/scooteridea-notification-service:latest
    expose:
    - '3007'
    environment:
      PORT: 3007
      REDIS_URL: redis://redis:6379
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
    - redis
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3007/health/ready
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
  websocket-hub:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-moses-dera}/scooteridea-websocket-hub:latest
    expose:
    - '3008'
    environment:
      PORT: 3008
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
    - redis
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3008/health/ready
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
  dock-service:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-moses-dera}/scooteridea-dock-service:latest
    expose:
    - '3009'
    environment:
      PORT: 3009
      DATABASE_URL: postgresql://ebike:secret@postgres:5432/ebike
      REDIS_URL: redis://redis:6379
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    depends_on:
    - postgres
    - redis
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3009/health/ready
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
  hardware-simulator:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-moses-dera}/scooteridea-hardware-simulator:latest
    environment:
      MQTT_BROKER: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      API_URL: http://nginx:80
    depends_on:
    - mosquitto
    - nginx
  loki:
    image: grafana/loki:2.9.0
    ports:
    - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
    - ./loki-config.yaml:/etc/loki/local-config.yaml
    - loki_data:/loki
  promtail:
    image: grafana/promtail:2.9.0
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./promtail-config.yaml:/etc/promtail/config.yml
    - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
    - loki
  grafana:
    image: grafana/grafana:latest
    ports:
    - 3000:3000
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
    - grafana_data:/var/lib/grafana
    depends_on:
    - loki
volumes:
  postgres_data: null
  redis_data: null
  mosquitto_data: null
  mosquitto_log: null
  loki_data: null
  grafana_data: null
