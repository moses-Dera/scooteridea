name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Deploy Backend (VPS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          script: |
            # 1. Navigate to the project directory
            cd /var/www/scooteridea
            
            # 2. Pull the latest code
            git pull origin main
            
            # 3. Rebuild the Docker images locally (since we aren't using an external registry yet)
            cd backend/infra
            docker compose build
            
            # 4. Apply Zero-Downtime update using Docker Swarm
            docker stack deploy -c docker-compose.yml scooter_stack
