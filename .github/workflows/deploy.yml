name: Production Deployment

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          [
            auth-service,
            fleet-service,
            ride-service,
            pricing-service,
            payment-service,
            notification-service,
            websocket-hub,
            dock-service,
          ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # We convert the service name to the exact folder name
      - name: Set folder name
        id: folder
        run: |
          if [ "${{ matrix.service }}" == "websocket-hub" ]; then
            echo "dir=websocket-hub" >> $GITHUB_OUTPUT
          else
            echo "dir=${{ matrix.service }}" | sed 's/-service//' >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/${{ steps.folder.outputs.dir }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/moses-dera/scooteridea-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  build-simulator:
    name: Build Simulator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./simulator
          file: ./simulator/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/moses-dera/scooteridea-hardware-simulator:latest
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,mode=max,scope=simulator

  deploy-backend:
    name: Deploy Backend (VPS)
    needs: [build-and-push, build-simulator]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          command_timeout: '30m'
          envs: MQTT_PASSWORD,MQTT_USERNAME,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,PAYSTACK_SECRET_KEY,STRIPE_SECRET_KEY,FRONTEND_URL,EXPO_ACCESS_TOKEN,GRAFANA_ADMIN_PASSWORD,SMTP_USER,SMTP_PASS,GMAIL_CLIENT_ID,GMAIL_CLIENT_SECRET,GMAIL_REFRESH_TOKEN,DATABASE_URL,DIRECT_URL,RABBITMQ_PASSWORD
          script: |
            # 0. Server Initialization & Cleanup
            docker swarm init || true
            docker system prune -f

            # 1. Navigate to the project directory
            cd /var/www/scooteridea

            # 2. Pull the latest code (for docker-compose.yml updates)
            git pull origin main
            cd backend/infra

            # 2b. Ensure developer's local SSH key is authorized on this VPS.
            #     Idempotent — only appends if not already present.
            DEV_KEY="${{ secrets.DEV_SSH_PUBLIC_KEY }}"
            if [ -n "$DEV_KEY" ]; then
              grep -qxF "$DEV_KEY" ~/.ssh/authorized_keys 2>/dev/null \
                || echo "$DEV_KEY" >> ~/.ssh/authorized_keys
            fi

            # 3. Write .env from GitHub Secrets (source of truth — never rely on a file left on the VPS)
            cat > .env <<'ENVEOF'
            MQTT_USERNAME=${{ secrets.MQTT_USERNAME }}
            MQTT_PASSWORD=${{ secrets.MQTT_PASSWORD }}
            RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_ACCESS_EXPIRY=15m
            JWT_REFRESH_EXPIRY=30d
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
            PAYSTACK_SECRET_KEY="${{ secrets.PAYSTACK_SECRET_KEY }}"
            STRIPE_SECRET_KEY="${{ secrets.STRIPE_SECRET_KEY }}"
            FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
            EXPO_ACCESS_TOKEN="${{ secrets.EXPO_ACCESS_TOKEN }}"
            GRAFANA_ADMIN_PASSWORD="${{ secrets.GRAFANA_ADMIN_PASSWORD }}"
            SMTP_USER="${{ secrets.SMTP_USER }}"
            SMTP_PASS="${{ secrets.SMTP_PASS }}"
            GMAIL_CLIENT_ID="${{ secrets.GMAIL_CLIENT_ID }}"
            GMAIL_CLIENT_SECRET="${{ secrets.GMAIL_CLIENT_SECRET }}"
            GMAIL_REFRESH_TOKEN="${{ secrets.GMAIL_REFRESH_TOKEN }}"
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            DIRECT_URL="${{ secrets.DIRECT_URL }}"
            CSRF_SECRET="${{ secrets.CSRF_SECRET }}"
            ENVEOF

            export GITHUB_REPOSITORY_OWNER=moses-dera
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3b. Auto-generate Mosquitto password file using a temp container.
            #     Recreated on every deploy so it stays in sync with the secret.
            docker run --rm eclipse-mosquitto:2 sh -c \
              "mosquitto_passwd -c -b /tmp/p '${{ secrets.MQTT_USERNAME }}' '${{ secrets.MQTT_PASSWORD }}' && cat /tmp/p" \
              > mosquitto.passwd

            # 3c. Run Database Migrations on VPS
            echo "Running Prisma migrations on VPS..."
            docker run --rm -v /var/www/scooteridea/backend/shared/db:/app/db -w /app/db -e DIRECT_URL="${{ secrets.DIRECT_URL }}" -e DATABASE_URL="${{ secrets.DATABASE_URL }}" node:24-alpine sh -c "npm install && npx prisma migrate deploy"

            # 4. Pull latest images and Deploy
            set -a
            source .env
            set +a
            docker compose pull
            docker stack deploy -c docker-compose.yml scooter_stack --with-registry-auth

            # 4b. Force restart notification-service to pick up new Gmail credentials
            docker service update --force scooter_stack_notification-service

            # 5. Force reload Nginx to pick up new upstream IPs
            sleep 15
            docker service update --force scooter_stack_nginx

            # 6. Clean up unused images and containers to free up space
            docker system prune -f
