name: Production Deployment

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth-service, fleet-service, ride-service, pricing-service, payment-service, notification-service, websocket-hub, dock-service]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # We convert the service name to the exact folder name
      - name: Set folder name
        id: folder
        run: |
          if [ "${{ matrix.service }}" == "websocket-hub" ]; then
            echo "dir=websocket-hub" >> $GITHUB_OUTPUT
          else
            echo "dir=${{ matrix.service }}" | sed 's/-service//' >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/services/${{ steps.folder.outputs.dir }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/moses-dera/scooteridea-${{ matrix.service }}:latest

  build-simulator:
    name: Build Simulator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./simulator
          file: ./simulator/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/moses-dera/scooteridea-hardware-simulator:latest

  deploy-backend:
    name: Deploy Backend (VPS)
    needs: [build-and-push, build-simulator]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          command_timeout: "10m"
          script: |
            # 1. Navigate to the project directory
            cd /var/www/scooteridea
            
            # 2. Pull the latest code (for docker-compose.yml updates)
            git pull origin main
            cd backend/infra
            
            # 3. Pull the pre-built images from GitHub Container Registry
            # Provide the repository owner name as an environment variable for docker-compose
            export GITHUB_REPOSITORY_OWNER=moses-dera
            
            # Since the packages might be private initially, we need to login
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Load environment variables from .env file for docker stack
            if [ -f .env ]; then
              export $(cat .env | grep -v '#' | awk '/=/ {print $1}')
            fi
            
            docker compose pull
            
            # 4. Apply Zero-Downtime update using Docker Swarm
            docker stack deploy -c docker-compose.yml scooter_stack
