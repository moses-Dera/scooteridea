name: Production Deployment

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          [
            auth-service,
            fleet-service,
            ride-service,
            pricing-service,
            payment-service,
            notification-service,
            websocket-hub,
            dock-service,
          ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # We convert the service name to the exact folder name
      - name: Set folder name
        id: folder
        run: |
          if [ "${{ matrix.service }}" == "websocket-hub" ]; then
            echo "dir=websocket-hub" >> $GITHUB_OUTPUT
          else
            echo "dir=${{ matrix.service }}" | sed 's/-service//' >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/services/${{ steps.folder.outputs.dir }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/moses-dera/scooteridea-${{ matrix.service }}:latest

  build-simulator:
    name: Build Simulator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./simulator
          file: ./simulator/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/moses-dera/scooteridea-hardware-simulator:latest

  deploy-backend:
    name: Deploy Backend (VPS)
    needs: [build-and-push, build-simulator]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          command_timeout: '30m'
          envs: MQTT_PASSWORD,MQTT_USERNAME,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,GOOGLE_CLIENT_ID,PAYSTACK_SECRET_KEY,STRIPE_SECRET_KEY,FRONTEND_URL,EXPO_ACCESS_TOKEN,GRAFANA_ADMIN_PASSWORD
          script: |
            # 0. Server Initialization & Cleanup
            docker swarm init || true
            docker system prune -a -f

            # 1. Navigate to the project directory
            cd /var/www/scooteridea

            # 2. Pull the latest code (for docker-compose.yml updates)
            git pull origin main
            cd backend/infra

            # 2b. Ensure developer's local SSH key is authorized on this VPS.
            #     Idempotent — only appends if not already present.
            DEV_KEY="${{ secrets.DEV_SSH_PUBLIC_KEY }}"
            if [ -n "$DEV_KEY" ]; then
              grep -qxF "$DEV_KEY" ~/.ssh/authorized_keys 2>/dev/null \
                || echo "$DEV_KEY" >> ~/.ssh/authorized_keys
            fi

            # 3. Write .env from GitHub Secrets (source of truth — never rely on a file left on the VPS)
            cat > .env <<'ENVEOF'
            MQTT_USERNAME=${{ secrets.MQTT_USERNAME }}
            MQTT_PASSWORD=${{ secrets.MQTT_PASSWORD }}
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_ACCESS_EXPIRY=15m
            JWT_REFRESH_EXPIRY=30d
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            PAYSTACK_SECRET_KEY=${{ secrets.PAYSTACK_SECRET_KEY }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            EXPO_ACCESS_TOKEN=${{ secrets.EXPO_ACCESS_TOKEN }}
            GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            ENVEOF

            export GITHUB_REPOSITORY_OWNER=moses-dera
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose pull

            # 3b. Auto-generate Mosquitto password file using a temp container.
            #     Recreated on every deploy so it stays in sync with the secret.
            docker run --rm eclipse-mosquitto:2 sh -c \
              "mosquitto_passwd -c -b /tmp/p '${{ secrets.MQTT_USERNAME }}' '${{ secrets.MQTT_PASSWORD }}' && cat /tmp/p" \
              > mosquitto.passwd

            # 4. Deploy
            set -a
            source .env
            set +a
            docker stack deploy -c docker-compose.yml scooter_stack

            # 5. Run Prisma Database Migrations
            echo "Waiting for services to start..."
            sleep 30
            AUTH_CONTAINER=$(docker ps -q -f name=scooter_stack_auth-service | head -n 1)
            if [ -n "$AUTH_CONTAINER" ]; then
              docker exec -w /app/backend/shared/db $AUTH_CONTAINER npx prisma migrate deploy || true
            else
              echo "Warning: Auth container not found. Migration skipped."
            fi

            # 6. Force reload Nginx to pick up new upstream IPs
            sleep 15
            docker service update --force scooter_stack_nginx
